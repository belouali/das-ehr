notes_history:
  path: /path/to/mimic-iv-note-2.2/note/discharge.csv.gz
  section_start: '(?im)^\s*(past medical history|past medical and surgical history|past medical/surgical history|pmh)\s*:'
  section_end: '(?im)^\s*(social history|family history|physical exam|physical examination|pertinent results|brief hospital course|medications on admission|discharge medications|allergies|history of present
    illness|chief complaint|past surgical history|psh|review of systems|admission labs|discharge diagnosis|discharge condition)\s*:'
  max_section_chars: 4000
  negation: \b(no|denies|denied|negative for|without|ruled out|r/o|rule out)\b
  skip_item: "^\\s*[-*\u2022]?\\s*(family history|fhx|fh)\\b"
  extra_include:
    diabetes:
    - \bDM\s*(2|II|type\s*(2|II))?\b
    - \bDMII\b
    - \bT2D\b
    - \bDM\s*(1|I|type\s*(1|I))\b
    - \b(N?IDDM|T1DM?|T2DM)\b
    - \bDKA\b
    hypertension:
    - \bHTN\b
    - \bhigh blood pressure\b
    chf:
    - \bHF(rEF|pEF|mrEF)?\b
    - \b[sd]CHF\b
    - \bsystolic heart failure\b
    - \bdiastolic heart failure\b
    af:
    - \bAF\b
    - \bPAF\b
    - \bAFL\b
    - \bA\.?\s?flutter\b
    - \bA\.?\s?fib\b
  extra_exclude:
    diabetes:
    - pre-?diabet
    - insipidus
    hypertension:
    - pulmonary (arterial )?hypertension
    - \bPAH\b
    - portal hypertension
    - intracranial hypertension
    - ocular hypertension
    - pre-?eclampsia
    - gestational hypertension
    chf: []
    af: []
das:
  min_records_per_hospital: 100
  k:
  - 5
  - 10
  - 20
  n_bootstrap: 1000
  seed: 20261105
icd:
  diabetes:
    icd9: ^(249|250)
    icd10: ^(E08|E09|E10|E11|E13)
  hypertension:
    icd9: ^(401|402|403|404|405)
    icd10: ^(I10|I11|I12|I13|I15|I16)
  chf:
